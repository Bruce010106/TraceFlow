services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: traceflow
      POSTGRES_USER: traceflow
      POSTGRES_PASSWORD: ${TRACEFLOW_DB_PASSWORD:?Set TRACEFLOW_DB_PASSWORD}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["traceflow-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceflow -d traceflow"]
      interval: 3s
      retries: 20
volumes:
  traceflow-db:
